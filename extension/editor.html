<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职聘通·网申助手 — 画像编辑器</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot">📋</span>职聘通·网申助手 <span class="badge">画像编辑器 v2.2</span></div>
    <div class="topbar-actions">
      <button id="btn-import-site" class="btn-ghost">🔄 从网站导入</button>
      <button id="btn-import-json" class="btn-ghost">📥 导入JSON</button>
      <button id="btn-export-json" class="btn-ghost">📤 导出JSON</button>
      <button id="btn-reset" class="btn-danger">🗑 清空</button>
      <button id="btn-save" class="btn-primary">💾 保存</button>
    </div>
  </div>
</div>

<div class="container">
  <!-- 保存状态提示 -->
  <div id="save-toast" class="toast" hidden></div>

  <!-- 左侧导航 -->
  <nav class="sidenav" id="sidenav">
    <a href="#sec-basic" class="active">基本信息</a>
    <a href="#sec-edu">教育背景</a>
    <a href="#sec-contact">联系方式</a>
    <a href="#sec-intent">求职意向</a>
    <a href="#sec-lang">语言能力</a>
    <a href="#sec-exp">经历</a>
    <a href="#sec-other">其他</a>
  </nav>

  <!-- 右侧表单 -->
  <main class="form-area">

    <!-- ========== 基本信息 ========== -->
    <section id="sec-basic" class="form-section">
      <h2>基本信息</h2>
      <div class="grid2">
        <label>姓名<input data-key="name" placeholder="张三"></label>
        <label>性别
          <select data-key="gender"><option value="">请选择</option><option>男</option><option>女</option></select>
        </label>
        <label>出生年月<input data-key="birth" placeholder="2005.01 或 2005-01"></label>
        <label>年龄<input data-key="age" placeholder="21"></label>
        <label>民族<input data-key="nation" placeholder="汉族" list="nations"></label>
        <datalist id="nations"><option>汉族</option><option>蒙古族</option><option>回族</option><option>藏族</option><option>维吾尔族</option><option>苗族</option><option>彝族</option><option>壮族</option><option>满族</option><option>其他</option></datalist>
        <label>政治面貌
          <select data-key="politics"><option value="">请选择</option><option>中共党员</option><option>中共预备党员</option><option>共青团员</option><option>群众</option><option>民主党派</option></select>
        </label>
        <label>身份证号<input data-key="idcard" placeholder="18位身份证号"></label>
        <label>婚姻状况
          <select data-key="marital"><option value="">请选择</option><option>未婚</option><option>已婚</option><option>离异</option></select>
        </label>
        <label>身高<input data-key="height" placeholder="178cm"></label>
        <label>健康状况
          <select data-key="health"><option value="">请选择</option><option>良好</option><option>一般</option></select>
        </label>
        <label>籍贯/生源地<input data-key="hometown" placeholder="浙江省杭州市"></label>
        <label>户口所在地<input data-key="hukouLocation" placeholder="浙江省杭州市西湖区"></label>
        <label>户口性质
          <select data-key="hukouType"><option value="">请选择</option><option>农业</option><option>非农业</option><option>居民户口</option></select>
        </label>
      </div>
    </section>

    <!-- ========== 教育背景 ========== -->
    <section id="sec-edu" class="form-section">
      <h2>教育背景</h2>
      <div class="grid2">
        <label>毕业院校<input data-key="school" placeholder="XX大学"></label>
        <label>专业<input data-key="major" placeholder="工商管理"></label>
        <label>第二专业/辅修<input data-key="secondMajor" placeholder="（选填）"></label>
        <label>学历/学位
          <select data-key="degree"><option value="">请选择</option><option>大专</option><option>本科</option><option>硕士研究生</option><option>博士研究生</option><option>MBA/MPA</option></select>
        </label>
        <label>入学时间<input data-key="schoolStart" placeholder="2023.09"></label>
        <label>毕业年份<input data-key="gradYear" placeholder="2027"></label>
        <label>毕业时间<input data-key="gradTime" placeholder="2027.06"></label>
        <label>排名/绩点<input data-key="rank" placeholder="专业排名前30% / GPA 3.5"></label>
        <label>导师<input data-key="tutor" placeholder="（研究生填写）"></label>
        <label>论文题目<input data-key="thesis" placeholder="（研究生填写）"></label>
        <label>培养方式
          <select data-key="eduType"><option value="">请选择</option><option>统招</option><option>非定向</option><option>定向</option><option>委培</option><option>自筹</option></select>
        </label>
      </div>
    </section>

    <!-- ========== 联系方式 ========== -->
    <section id="sec-contact" class="form-section">
      <h2>联系方式</h2>
      <div class="grid2">
        <label>手机号<input data-key="phone" placeholder="13800138000"></label>
        <label>邮箱<input data-key="email" placeholder="you@example.com"></label>
        <label>微信号<input data-key="wechat" placeholder="your_wechat"></label>
        <label>省份<input data-key="province" placeholder="浙江"></label>
        <label>现居城市<input data-key="city" placeholder="杭州市"></label>
        <label>通讯地址<input data-key="address" placeholder="XX省XX市XX区XX路X号"></label>
        <label>邮编<input data-key="postcode" placeholder="310000"></label>
        <label>紧急联系人<input data-key="emergencyContact" placeholder="姓名"></label>
        <label>紧急联系电话<input data-key="emergencyPhone" placeholder="13900139000"></label>
        <label>与联系人关系<input data-key="emergencyRelation" placeholder="父子/母女/兄妹"></label>
      </div>
    </section>

    <!-- ========== 求职意向 ========== -->
    <section id="sec-intent" class="form-section">
      <h2>求职意向</h2>
      <div class="grid2">
        <label>求职意向/期望职位<input data-key="target" placeholder="销售管培生"></label>
        <label>期望城市<input data-key="preferCity" placeholder="杭州、北京、上海"></label>
        <label>求职类型
          <select data-key="jobType"><option value="">请选择</option><option>全职</option><option>实习</option><option>兼职</option><option>校园招聘</option></select>
        </label>
        <label>期望月薪<input data-key="expSalary" placeholder="8-12K"></label>
        <label>期望年薪<input data-key="expAnnual" placeholder="10-15万"></label>
        <label>接受调剂
          <select data-key="acceptAdjust"><option value="">请选择</option><option>接受</option><option>不接受</option><option>服从</option></select>
        </label>
        <label>可到岗时间<input data-key="availableTime" placeholder="随时到岗 / 2026年7月"></label>
        <label>实习时长<input data-key="internDuration" placeholder="3个月以上"></label>
        <label>每周实习天数<input data-key="internDays" placeholder="5天/周"></label>
        <label>获知渠道
          <select data-key="channel"><option value="">请选择</option><option>校内就业网</option><option>招聘网站</option><option>朋友推荐</option><option>公司官网</option><option>校园宣讲会</option><option>微信公众号</option><option>其他</option></select>
        </label>
      </div>
    </section>

    <!-- ========== 语言能力 ========== -->
    <section id="sec-lang" class="form-section">
      <h2>语言能力</h2>
      <div class="grid2">
        <label>英语水平<input data-key="english" placeholder="CET-4 / CET-6 / 雅思7.0" list="english-levels"></label>
        <datalist id="english-levels"><option>CET-4</option><option>CET-6</option><option>专四</option><option>专八</option><option>雅思7.0</option><option>托福100</option><option>无</option></datalist>
        <label>其他外语<input data-key="otherLang" placeholder="日语N2 / 法语"></label>
        <label>计算机水平<input data-key="computerLevel" placeholder="二级 / 三级"></label>
        <label>普通话水平<input data-key="mandarin" placeholder="二级甲等"></label>
      </div>
    </section>

    <!-- ========== 经历（动态数组） ========== -->
    <section id="sec-exp" class="form-section">
      <h2>经历</h2>

      <!-- 实习/工作经历 -->
      <div class="dynamic-block" data-array-key="experiences">
        <div class="block-head">
          <h3>实习/工作经历</h3>
          <button class="btn-add" onclick="addRow('experiences')">+ 添加</button>
        </div>
        <div class="rows" id="rows-experiences"></div>
        <template id="tpl-experiences">
          <div class="exp-row">
            <input data-field="org" placeholder="公司/单位">
            <input data-field="role" placeholder="职位">
            <input data-field="time" placeholder="2025.06-2025.09">
            <textarea data-field="desc" placeholder="工作描述（简述）" rows="2"></textarea>
            <button class="btn-del" onclick="removeRow(this)">✕</button>
          </div>
        </template>
      </div>

      <!-- 校园经历 -->
      <div class="dynamic-block" data-array-key="campus">
        <div class="block-head">
          <h3>校园经历 / 学生工作</h3>
          <button class="btn-add" onclick="addRow('campus')">+ 添加</button>
        </div>
        <div class="rows" id="rows-campus"></div>
        <template id="tpl-campus">
          <div class="exp-row">
            <input data-field="org" placeholder="社团/组织">
            <input data-field="role" placeholder="职务">
            <input data-field="time" placeholder="2023.10-2024.06">
            <textarea data-field="desc" placeholder="描述" rows="2"></textarea>
            <button class="btn-del" onclick="removeRow(this)">✕</button>
          </div>
        </template>
      </div>

      <!-- 获奖经历 -->
      <div class="dynamic-block" data-array-key="awards">
        <div class="block-head">
          <h3>获奖经历</h3>
          <button class="btn-add" onclick="addRow('awards')">+ 添加</button>
        </div>
        <div class="rows" id="rows-awards"></div>
        <template id="tpl-awards">
          <div class="exp-row award-row">
            <input data-field="name" placeholder="奖项名称">
            <input data-field="level" placeholder="级别（国家级/省级/校级）">
            <input data-field="time" placeholder="获奖时间">
            <button class="btn-del" onclick="removeRow(this)">✕</button>
          </div>
        </template>
      </div>

      <!-- 项目经历 -->
      <div class="dynamic-block" data-array-key="projects">
        <div class="block-head">
          <h3>项目经历</h3>
          <button class="btn-add" onclick="addRow('projects')">+ 添加</button>
        </div>
        <div class="rows" id="rows-projects"></div>
        <template id="tpl-projects">
          <div class="exp-row">
            <input data-field="name" placeholder="项目名称">
            <input data-field="role" placeholder="担任角色">
            <input data-field="time" placeholder="2024.03-2024.06">
            <textarea data-field="desc" placeholder="项目描述" rows="2"></textarea>
            <button class="btn-del" onclick="removeRow(this)">✕</button>
          </div>
        </template>
      </div>

      <!-- 论文/著作 -->
      <div class="dynamic-block" data-array-key="papers">
        <div class="block-head">
          <h3>论文 / 著作</h3>
          <button class="btn-add" onclick="addRow('papers')">+ 添加</button>
        </div>
        <div class="rows" id="rows-papers"></div>
        <template id="tpl-papers">
          <div class="exp-row">
            <input data-field="title" placeholder="论文标题">
            <input data-field="journal" placeholder="期刊/会议">
            <input data-field="year" placeholder="发表年份">
            <button class="btn-del" onclick="removeRow(this)">✕</button>
          </div>
        </template>
      </div>

      <!-- 志愿服务 -->
      <div class="dynamic-block" data-array-key="volunteer">
        <div class="block-head">
          <h3>志愿服务经历</h3>
          <button class="btn-add" onclick="addRow('volunteer')">+ 添加</button>
        </div>
        <div class="rows" id="rows-volunteer"></div>
        <template id="tpl-volunteer">
          <div class="exp-row">
            <input data-field="org" placeholder="组织/机构">
            <input data-field="role" placeholder="角色">
            <input data-field="time" placeholder="2024.05">
            <textarea data-field="desc" placeholder="描述" rows="2"></textarea>
            <button class="btn-del" onclick="removeRow(this)">✕</button>
          </div>
        </template>
      </div>
    </section>

    <!-- ========== 其他 ========== -->
    <section id="sec-other" class="form-section">
      <h2>其他信息</h2>
      <div class="grid2">
        <label class="full">证书 / 资格证<input data-key="certs" placeholder="CET-4, 计算机二级, 证券从业资格（逗号分隔）"></label>
        <label class="full">技能 / 特长<input data-key="skills" placeholder="Python, 数据分析, 客户沟通（逗号分隔）"></label>
        <label class="full">个人优势 / 核心竞争力<input data-key="strengths" placeholder="客户沟通能力强，擅长数据分析"></label>
        <label class="full">自我介绍 / 自我评价<textarea data-key="selfIntro" rows="4" placeholder="简要介绍自己，突出优势与求职意向"></textarea></label>
        <label class="full">兴趣爱好<input data-key="hobbies" placeholder="篮球、阅读、摄影"></label>
      </div>

      <!-- 家庭信息 -->
      <div class="dynamic-block" data-array-key="family">
        <div class="block-head">
          <h3>家庭信息</h3>
          <button class="btn-add" onclick="addRow('family')">+ 添加</button>
        </div>
        <div class="rows" id="rows-family"></div>
        <template id="tpl-family">
          <div class="exp-row family-row">
            <input data-field="relation" placeholder="关系（父亲/母亲/配偶）">
            <input data-field="name" placeholder="姓名">
            <input data-field="company" placeholder="工作单位">
            <input data-field="position" placeholder="职务">
            <button class="btn-del" onclick="removeRow(this)">✕</button>
          </div>
        </template>
      </div>
    </section>

    <!-- 底部保存栏 -->
    <div class="bottom-bar">
      <span id="save-status" class="save-status">未保存</span>
      <button id="btn-save-2" class="btn-primary">💾 保存画像</button>
    </div>
  </main>
</div>

<!-- 导入JSON对话框 -->
<dialog id="dlg-import" class="dialog">
  <h3>导入 JSON</h3>
  <p class="dialog-hint">粘贴简历画像 JSON 文本，或选择文件导入：</p>
  <textarea id="import-area" rows="12" spellcheck="false" placeholder='{"name":"张三",...}'></textarea>
  <div class="dialog-actions">
    <button onclick="document.getElementById('dlg-import').close()">取消</button>
    <button id="btn-do-import" class="btn-primary">导入</button>
  </div>
</dialog>

<!-- 导出JSON对话框 -->
<dialog id="dlg-export" class="dialog">
  <h3>导出 JSON</h3>
  <textarea id="export-area" rows="16" spellcheck="false" readonly></textarea>
  <div class="dialog-actions">
    <button id="btn-copy-json">复制到剪贴板</button>
    <button id="btn-download-json" class="btn-primary">下载文件</button>
    <button onclick="document.getElementById('dlg-export').close()">关闭</button>
  </div>
</dialog>

<script src="editor.js"></script>
</body>
</html>
